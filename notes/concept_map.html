l", "label": "정규분포 normal", "group": "math", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "math_glossary.html", "level": 3}, {"id": "mean", "label": "평균 mean", "group": "math", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "math_glossary.html", "level": 3}, {"id": "std", "label": "표준편차 std", "group": "math", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "math_glossary.html", "level": 3}, {"id": "matmul", "label": "행렬곱 @", "group": "math", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "math_glossary.html", "level": 3}, {"id": "lstsq", "label": "최소제곱 lstsq", "group": "math", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "math_glossary.html", "level": 3}, {"id": "ndim", "label": "차원 ndim / shape", "group": "math", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "math_glossary.html", "level": 3}, {"id": "axis", "label": "axis=N 규칙", "group": "math", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "math_glossary.html", "level": 3}, {"id": "X", "label": ".X (발현 행렬)", "group": "anndata", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "anndata_practice_note.html", "level": 3}, {"id": "obs", "label": ".obs (세포 정보)", "group": "anndata", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "anndata_practice_note.html", "level": 3}, {"id": "var", "label": ".var (유전자 정보)", "group": "anndata", "value": 13, "font": {"size": 12, "face": "Apple SD Gothic Neo, sans-serif", "color": "#202124"}, "url": "anndata_practice_note.html", "level": 3}];
const rawEdges = [{"from": "VCC", "to": "STATE", "id": "e0"}, {"from": "VCC", "to": "metrics", "id": "e1"}, {"from": "VCC", "to": "approach", "id": "e2"}, {"from": "VCC", "to": "pipeline", "id": "e3"}, {"from": "VCC", "to": "pybasic", "id": "e4"}, {"from": "VCC", "to": "math", "id": "e5"}, {"from": "VCC", "to": "anndata", "id": "e6"}, {"from": "STATE", "to": "SE", "id": "e7"}, {"from": "STATE", "to": "ST", "id": "e8"}, {"from": "SE", "to": "clstoken", "id": "e9"}, {"from": "SE", "to": "transformer", "id": "e10"}, {"from": "ST", "to": "encpert", "id": "e11"}, {"from": "SE", "to": "scGPT", "id": "e12"}, {"from": "ST", "to": "fitB", "id": "e13"}, {"from": "metrics", "to": "MAE", "id": "e14"}, {"from": "metrics", "to": "PDS", "id": "e15"}, {"from": "metrics", "to": "DES", "id": "e16"}, {"from": "score_all", "to": "MAE", "id": "e17"}, {"from": "score_all", "to": "PDS", "id": "e18"}, {"from": "score_all", "to": "DES", "id": "e19"}, {"from": "approach", "to": "apA", "id": "e20"}, {"from": "approach", "to": "apB", "id": "e21"}, {"from": "approach", "to": "apC", "id": "e22"}, {"from": "approach", "to": "apD", "id": "e23"}, {"from": "apC", "to": "scGPT", "id": "e24"}, {"from": "apA", "to": "fitA", "id": "e25"}, {"from": "apB", "to": "fitB", "id": "e26"}, {"from": "pipeline", "to": "make_dataset", "id": "e27"}, {"from": "pipeline", "to": "fitA", "id": "e28"}, {"from": "pipeline", "to": "fitB", "id": "e29"}, {"from": "pipeline", "to": "score_all", "id": "e30"}, {"from": "fitB", "to": "descriptor", "id": "e31"}, {"from": "fitB", "to": "matmul", "id": "e32"}, {"from": "fitB", "to": "lstsq", "id": "e33"}, {"from": "fitA", "to": "mean", "id": "e34"}, {"from": "make_dataset", "to": "uniform", "id": "e35"}, {"from": "make_dataset", "to": "normal", "id": "e36"}, {"from": "pybasic", "to": "list", "id": "e37"}, {"from": "pybasic", "to": "ndarray", "id": "e38"}, {"from": "pybasic", "to": "dict", "id": "e39"}, {"from": "pybasic", "to": "indexing", "id": "e40"}, {"from": "math", "to": "uniform", "id": "e41"}, {"from": "math", "to": "normal", "id": "e42"}, {"from": "math", "to": "mean", "id": "e43"}, {"from": "math", "to": "std", "id": "e44"}, {"from": "math", "to": "matmul", "id": "e45"}, {"from": "math", "to": "lstsq", "id": "e46"}, {"from": "math", "to": "ndim", "id": "e47"}, {"from": "math", "to": "axis", "id": "e48"}, {"from": "anndata", "to": "X", "id": "e49"}, {"from": "anndata", "to": "obs", "id": "e50"}, {"from": "anndata", "to": "var", "id": "e51"}, {"from": "X", "to": "mean", "id": "e52"}, {"from": "ndarray", "to": "matmul", "id": "e53"}];
const groups = {"root": {"color": {"background": "#5f6368", "border": "#5f6368", "highlight": {"background": "#5f6368", "border": "#000"}}, "font": {"color": "#202124"}}, "state": {"color": {"background": "#188038", "border": "#188038", "highlight": {"background": "#188038", "border": "#000"}}, "font": {"color": "#202124"}}, "metric": {"color": {"background": "#d93025", "border": "#d93025", "highlight": {"background": "#d93025", "border": "#000"}}, "font": {"color": "#202124"}}, "approach": {"color": {"background": "#7b1fa2", "border": "#7b1fa2", "highlight": {"background": "#7b1fa2", "border": "#000"}}, "font": {"color": "#202124"}}, "code": {"color": {"background": "#1565c0", "border": "#1565c0", "highlight": {"background": "#1565c0", "border": "#000"}}, "font": {"color": "#202124"}}, "py": {"color": {"background": "#00838f", "border": "#00838f", "highlight": {"background": "#00838f", "border": "#000"}}, "font": {"color": "#202124"}}, "math": {"color": {"background": "#e8710a", "border": "#e8710a", "highlight": {"background": "#e8710a", "border": "#000"}}, "font": {"color": "#202124"}}, "anndata": {"color": {"background": "#c2185b", "border": "#c2185b", "highlight": {"background": "#c2185b", "border": "#000"}}, "font": {"color": "#202124"}}};
const nodes = new vis.DataSet(rawNodes);
const edges = new vis.DataSet(rawEdges);
const container = document.getElementById('net');
const data = {nodes, edges};
const options = {
  nodes:{shape:'dot', scaling:{min:10,max:40}, borderWidth:2},
  edges:{color:{color:'#cfd4da',highlight:'#888'}, width:1.5, smooth:{type:'continuous'}},
  groups: groups,
  physics:{stabilization:{iterations:250}, barnesHut:{gravitationalConstant:-8000, springLength:110, springConstant:0.04}},
  interaction:{hover:true, tooltipDelay:120, zoomSpeed:0.35, hoverConnectedEdges:true},
};
const network = new vis.Network(container, data, options);
// 안정화 끝나면 물리 정지 → 줌/팬이 부드러워짐
network.once('stabilizationIterationsDone', function(){
  network.setOptions({physics:false});
});
// 원본 색 저장 (호버 강조 복원용)
const baseColors = {};
rawNodes.forEach(n=>{ baseColors[n.id] = (groups[n.group]||{}).color; });

// 클릭 → 노트 이동
network.on('click', function(params){
  if(params.nodes.length){
    const n = nodes.get(params.nodes[0]);
    if(n.url){ window.open(n.url, '_blank'); }
  }
});
// 호버 강조: 연결된 노드/엣지만 선명, 나머지 흐림
function neighborsOf(id){
  const s = new Set([id]);
  rawEdges.forEach(e=>{ if(e.from===id) s.add(e.to); if(e.to===id) s.add(e.from); });
  return s;
}
network.on('hoverNode', function(params){
  const keep = neighborsOf(params.node);
  nodes.update(rawNodes.map(n=>({
    id:n.id,
    color: keep.has(n.id) ? undefined : {background:'#e8eaed', border:'#e0e0e0'},
    font: {color: keep.has(n.id) ? '#202124' : '#c4c7cc', size:(n.font||{}).size, face:'Apple SD Gothic Neo, sans-serif'},
    opacity: keep.has(n.id) ? 1 : 0.35,
  })));
  edges.update(rawEdges.map((e,i)=>({
    id:'e'+i, from:e.from, to:e.to,
    color:(e.from===params.node||e.to===params.node)?{color:'#888'}:{color:'#eceef0'},
  })));
});
network.on('blurNode', function(){
  nodes.update(rawNodes.map(n=>({id:n.id, color:undefined, opacity:1,
    font:{color:'#202124', size:(n.font||{}).size, face:'Apple SD Gothic Neo, sans-serif'}})));
  edges.update(rawEdges.map((e,i)=>({id:'e'+i, from:e.from, to:e.to, color:{color:'#cfd4da'}})));
});
// 검색 → 해당 노드로 focus + 강조
document.getElementById('search').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    const q = e.target.value.trim().toLowerCase();
    if(!q) return;
    const hit = rawNodes.find(n=>n.label.toLowerCase().includes(q));
    if(hit){ network.focus(hit.id,{scale:1.3,animation:true}); network.selectNodes([hit.id]); }
  }
});
</script></body></html>
